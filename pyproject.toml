[project]
name = "physics-reasoning-engine"
version = "0.1.0"
description = "Neuro-Symbolic Physics Reasoning Engine for Small LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.7",
    "sympy>=1.13",
    "pint>=0.24",
    "litellm>=1.40",
    "structlog>=24.1",
    "click>=8.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
physics-engine = "physics_reasoning.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_reasoning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/physics_reasoning"]
omit = ["tests/*"]
