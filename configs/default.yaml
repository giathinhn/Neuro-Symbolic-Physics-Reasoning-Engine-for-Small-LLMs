# Default pipeline configuration
# Override via environment variables or by passing a different config file.

# LLM settings
model_name: "ollama_chat/qwen2.5:3b"
temperature: 0.1
max_tokens: 2048
timeout_seconds: 60.0

# Pipeline settings
max_retries: 3
max_tool_calls_per_attempt: 10

# Paths
knowledge_base_path: "data/knowledge"
dataset_path: "data/problems"

# Verification toggles (all enabled by default)
enable_dimensional_check: true
enable_unit_check: true
enable_arithmetic_check: true
enable_bounds_check: true
enable_substitution_check: true
enable_consistency_check: true
enable_equation_validity_check: true

# Numerical settings
numerical_tolerance: 1.0e-6
answer_tolerance: 0.01
solver_timeout_seconds: 10.0

# Reproducibility
random_seed: 42

# Logging
log_level: "INFO"
log_file: null

# LLM mode
use_tool_calling: false
