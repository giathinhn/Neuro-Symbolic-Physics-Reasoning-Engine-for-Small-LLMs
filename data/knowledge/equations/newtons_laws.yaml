equations:
  - id: "newton2"
    name: "Newton's Second Law"
    expression: "F = m * a"
    variables: ["F", "m", "a"]
    variable_quantities:
      F: "force"
      m: "mass"
      a: "acceleration"
    domain: "mechanics"
    topic: "newton_laws"
    description: "Net force equals mass times acceleration"
    conditions: ["constant mass", "inertial frame"]
    dimension_lhs: "M L T^-2"
    dimension_rhs: "M L T^-2"

  - id: "weight_P"
    name: "Weight formula P = m * g"
    expression: "P = m * g"
    variables: ["P", "m", "g"]
    variable_quantities:
      P: "weight"
      m: "mass"
      g: "gravity"
    domain: "mechanics"
    topic: "newton_laws"
    description: "Weight is the gravitational force acting on a mass"
    conditions: ["near Earth surface"]
    dimension_lhs: "M L T^-2"
    dimension_rhs: "M L T^-2"

  - id: "weight_W"
    name: "Weight formula W = m * g"
    expression: "W = m * g"
    variables: ["W", "m", "g"]
    variable_quantities:
      W: "weight"
      m: "mass"
      g: "gravity"
    domain: "mechanics"
    topic: "newton_laws"
    description: "Weight formula using W"
    conditions: ["near Earth surface"]
    dimension_lhs: "M L T^-2"
    dimension_rhs: "M L T^-2"

  - id: "solid_pressure"
    name: "Solid pressure definition"
    expression: "p = F / S"
    variables: ["p", "F", "S"]
    variable_quantities:
      p: "pressure"
      F: "force"
      S: "area"
    domain: "mechanics"
    topic: "pressure"
    description: "Pressure equals normal force divided by contact area"
    conditions: ["perpendicular uniform force"]
    dimension_lhs: "M L^-1 T^-2"
    dimension_rhs: "M L^-1 T^-2"

  - id: "archimedes_buoyancy"
    name: "Archimedes Buoyancy Force"
    expression: "F_A = d * V"
    variables: ["F_A", "d", "V"]
    variable_quantities:
      F_A: "buoyant_force"
      d: "specific_weight"
      V: "volume"
    domain: "mechanics"
    topic: "archimedes"
    description: "Archimedes buoyant force equals specific weight of liquid times submerged volume"
    conditions: ["submerged object in liquid"]
    dimension_lhs: "M L T^-2"
    dimension_rhs: "M L T^-2"

  - id: "density_mass_volume"
    name: "Density definition"
    expression: "m = rho * V"
    variables: ["m", "rho", "V"]
    variable_quantities:
      m: "mass"
      rho: "density"
      V: "volume"
    domain: "mechanics"
    topic: "density"
    description: "Mass equals density times volume"
    conditions: []
    dimension_lhs: "M"
    dimension_rhs: "M"

  - id: "friction_def"
    name: "Friction force"
    expression: "f = mu * N"
    variables: ["f", "mu", "N"]
    variable_quantities:
      f: "friction_force"
      mu: "friction_coefficient"
      N: "normal_force"
    domain: "mechanics"
    topic: "newton_laws"
    description: "Maximum static or kinetic friction force"
    conditions: ["dry friction"]
    dimension_lhs: "M L T^-2"
    dimension_rhs: "M L T^-2"

  - id: "net_force_1d"
    name: "Net force 1D opposition"
    expression: "F_net = F1 - F2"
    variables: ["F_net", "F1", "F2"]
    variable_quantities:
      F_net: "force"
      F1: "force"
      F2: "force"
    domain: "mechanics"
    topic: "newton_laws"
    description: "Net force from opposing collinear forces"
    conditions: ["1D motion"]
    dimension_lhs: "M L T^-2"
    dimension_rhs: "M L T^-2"

  - id: "volume_box_def"
    name: "Volume of a rectangular box"
    expression: "V = l * w * h"
    variables: ["V", "l", "w", "h"]
    variable_quantities:
      V: "volume"
      l: "length"
      w: "width"
      h: "height"
    domain: "mechanics"
    topic: "newton_laws"
    description: "Volume of a rectangular prism equals length times width times height"
    conditions: []
    dimension_lhs: "L^3"
    dimension_rhs: "L^3"
