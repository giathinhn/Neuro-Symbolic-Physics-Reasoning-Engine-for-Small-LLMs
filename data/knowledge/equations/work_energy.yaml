equations:
  - id: "work_A_def"
    name: "Mechanical Work formula A = F * s"
    expression: "A = F * s"
    variables: ["A", "F", "s"]
    variable_quantities:
      A: "work"
      F: "force"
      s: "path"
    domain: "mechanics"
    topic: "work_energy"
    description: "Mechanical work done by force over distance"
    conditions: ["force parallel to displacement"]
    dimension_lhs: "M L^2 T^-2"
    dimension_rhs: "M L^2 T^-2"

  - id: "work_def"
    name: "Work definition"
    expression: "W_work = F * d"
    variables: ["W_work", "F", "d"]
    variable_quantities:
      W_work: "work"
      F: "force"
      d: "displacement"
    domain: "mechanics"
    topic: "work_energy"
    description: "Work done by a constant force in direction of motion"
    conditions: ["force parallel to displacement"]
    dimension_lhs: "M L^2 T^-2"
    dimension_rhs: "M L^2 T^-2"

  - id: "power_from_work_time"
    name: "Power formula P = A / t"
    expression: "P = A / t"
    variables: ["P", "A", "t"]
    variable_quantities:
      P: "power"
      A: "work"
      t: "time"
    domain: "mechanics"
    topic: "work_energy"
    description: "Power equals mechanical work divided by time"
    conditions: ["constant power"]
    dimension_lhs: "M L^2 T^-3"
    dimension_rhs: "M L^2 T^-3"

  - id: "power_force_dist_time"
    name: "Power from force, distance, time"
    expression: "P = (F * s) / t"
    variables: ["P", "F", "s", "t"]
    variable_quantities:
      P: "power"
      F: "force"
      s: "path"
      t: "time"
    domain: "mechanics"
    topic: "work_energy"
    description: "Power delivered by force over distance in time t"
    conditions: []
    dimension_lhs: "M L^2 T^-3"
    dimension_rhs: "M L^2 T^-3"

  - id: "power_def"
    name: "Power definition"
    expression: "P = W_work / t"
    variables: ["P", "W_work", "t"]
    variable_quantities:
      P: "power"
      W_work: "work"
      t: "time"
    domain: "mechanics"
    topic: "work_energy"
    description: "Power is the rate at which work is done"
    conditions: ["constant power"]
    dimension_lhs: "M L^2 T^-3"
    dimension_rhs: "M L^2 T^-3"

  - id: "ke_def"
    name: "Kinetic energy"
    expression: "KE = (1/2) * m * v^2"
    variables: ["KE", "m", "v"]
    variable_quantities:
      KE: "kinetic_energy"
      m: "mass"
      v: "velocity"
    domain: "mechanics"
    topic: "work_energy"
    description: "Kinetic energy of a moving mass"
    conditions: ["classical mechanics", "v << c"]
    dimension_lhs: "M L^2 T^-2"
    dimension_rhs: "M L^2 T^-2"

  - id: "pe_def"
    name: "Gravitational potential energy"
    expression: "PE = m * g * h"
    variables: ["PE", "m", "g", "h"]
    variable_quantities:
      PE: "potential_energy"
      m: "mass"
      g: "gravity"
      h: "height"
    domain: "mechanics"
    topic: "work_energy"
    description: "Gravitational potential energy near Earth's surface"
    conditions: ["uniform gravity"]
    dimension_lhs: "M L^2 T^-2"
    dimension_rhs: "M L^2 T^-2"

  - id: "work_energy_thm"
    name: "Work-energy theorem"
    expression: "W_work = KE_f - KE_i"
    variables: ["W_work", "KE_f", "KE_i"]
    variable_quantities:
      W_work: "work"
      KE_f: "kinetic_energy"
      KE_i: "kinetic_energy"
    domain: "mechanics"
    topic: "work_energy"
    description: "Net work done equals change in kinetic energy"
    conditions: []
    dimension_lhs: "M L^2 T^-2"
    dimension_rhs: "M L^2 T^-2"

  - id: "power_force_vel"
    name: "Power from force and velocity"
    expression: "P = F * v"
    variables: ["P", "F", "v"]
    variable_quantities:
      P: "power"
      F: "force"
      v: "velocity"
    domain: "mechanics"
    topic: "work_energy"
    description: "Power delivered by force at constant velocity"
    conditions: ["force parallel to velocity"]
    dimension_lhs: "M L^2 T^-3"
    dimension_rhs: "M L^2 T^-3"
