equations:
  - id: "ohm_law"
    name: "Ohm's Law"
    expression: "I = U / R"
    variables: ["I", "U", "R"]
    variable_quantities:
      I: "current"
      U: "voltage"
      R: "resistance"
    domain: "electricity"
    topic: "circuits"
    description: "Electric current equals voltage divided by resistance"
    conditions: ["constant temperature"]
    dimension_lhs: "I"
    dimension_rhs: "I"

  - id: "ohm_law_resistor_1"
    name: "Ohm's Law for Resistor 1"
    expression: "I_1 = U_1 / R_1"
    variables: ["I_1", "U_1", "R_1"]
    variable_quantities:
      I_1: "current_1"
      U_1: "voltage_1"
      R_1: "resistance_1"
    domain: "electricity"
    topic: "circuits"
    description: "Current through resistor 1 equals voltage across resistor 1 divided by R1"
    conditions: []
    dimension_lhs: "I"
    dimension_rhs: "I"

  - id: "ohm_law_resistor_2"
    name: "Ohm's Law for Resistor 2"
    expression: "I_2 = U_2 / R_2"
    variables: ["I_2", "U_2", "R_2"]
    variable_quantities:
      I_2: "current_2"
      U_2: "voltage_2"
      R_2: "resistance_2"
    domain: "electricity"
    topic: "circuits"
    description: "Current through resistor 2 equals voltage across resistor 2 divided by R2"
    conditions: []
    dimension_lhs: "I"
    dimension_rhs: "I"

  - id: "parallel_voltage_1"
    name: "Parallel Voltage 1"
    expression: "U_1 = U"
    variables: ["U_1", "U"]
    variable_quantities:
      U_1: "voltage_1"
      U: "voltage"
    domain: "electricity"
    topic: "circuits"
    description: "Voltage across parallel branch 1 equals total voltage"
    conditions: ["parallel circuit"]
    dimension_lhs: "M L^2 T^-3 I^-1"
    dimension_rhs: "M L^2 T^-3 I^-1"

  - id: "parallel_voltage_2"
    name: "Parallel Voltage 2"
    expression: "U_2 = U"
    variables: ["U_2", "U"]
    variable_quantities:
      U_2: "voltage_2"
      U: "voltage"
    domain: "electricity"
    topic: "circuits"
    description: "Voltage across parallel branch 2 equals total voltage"
    conditions: ["parallel circuit"]
    dimension_lhs: "M L^2 T^-3 I^-1"
    dimension_rhs: "M L^2 T^-3 I^-1"

  - id: "parallel_resistors_two"
    name: "Equivalent Resistance for Two Parallel Resistors"
    expression: "R_eq = (R_1 * R_2) / (R_1 + R_2)"
    variables: ["R_eq", "R_1", "R_2"]
    variable_quantities:
      R_eq: "equivalent_resistance"
      R_1: "resistance_1"
      R_2: "resistance_2"
    domain: "electricity"
    topic: "circuits"
    description: "Equivalent resistance for two resistors connected in parallel"
    conditions: ["two resistors in parallel"]
    dimension_lhs: "M L^2 T^-3 I^-2"
    dimension_rhs: "M L^2 T^-3 I^-2"

  - id: "series_resistors_two"
    name: "Equivalent Resistance for Two Series Resistors"
    expression: "R_eq = R_1 + R_2"
    variables: ["R_eq", "R_1", "R_2"]
    variable_quantities:
      R_eq: "equivalent_resistance"
      R_1: "resistance_1"
      R_2: "resistance_2"
    domain: "electricity"
    topic: "circuits"
    description: "Equivalent resistance for two resistors connected in series"
    conditions: ["two resistors in series"]
    dimension_lhs: "M L^2 T^-3 I^-2"
    dimension_rhs: "M L^2 T^-3 I^-2"

  - id: "electric_power_ui"
    name: "Electric power P = U * I"
    expression: "P = U * I"
    variables: ["P", "U", "I"]
    variable_quantities:
      P: "power"
      U: "voltage"
      I: "current"
    domain: "electricity"
    topic: "circuits"
    description: "Electric power equals voltage times current"
    conditions: []
    dimension_lhs: "M L^2 T^-3"
    dimension_rhs: "M L^2 T^-3"

  - id: "electric_power_i2r"
    name: "Electric power P = I^2 * R"
    expression: "P = I^2 * R"
    variables: ["P", "I", "R"]
    variable_quantities:
      P: "power"
      I: "current"
      R: "resistance"
    domain: "electricity"
    topic: "circuits"
    description: "Electric power dissipated in resistor equals I squared times R"
    conditions: []
    dimension_lhs: "M L^2 T^-3"
    dimension_rhs: "M L^2 T^-3"

  - id: "electric_power_u2_div_r"
    name: "Electric power P = U^2 / R"
    expression: "P = U^2 / R"
    variables: ["P", "U", "R"]
    variable_quantities:
      P: "power"
      U: "voltage"
      R: "resistance"
    domain: "electricity"
    topic: "circuits"
    description: "Electric power equals U squared divided by R"
    conditions: []
    dimension_lhs: "M L^2 T^-3"
    dimension_rhs: "M L^2 T^-3"

  - id: "electric_energy_uit"
    name: "Electrical energy A = U * I * t"
    expression: "A = U * I * t"
    variables: ["A", "U", "I", "t"]
    variable_quantities:
      A: "work"
      U: "voltage"
      I: "current"
      t: "time"
    domain: "electricity"
    topic: "circuits"
    description: "Electrical energy consumed in time t"
    conditions: []
    dimension_lhs: "M L^2 T^-2"
    dimension_rhs: "M L^2 T^-2"

  - id: "wire_resistance_formula"
    name: "Wire Resistance Formula R = rho * l / S"
    expression: "R = (rho * l) / S"
    variables: ["R", "rho", "l", "S"]
    variable_quantities:
      R: "resistance"
      rho: "resistivity"
      l: "length"
      S: "area"
    domain: "electricity"
    topic: "circuits"
    description: "Resistance of a uniform wire of length l and cross-sectional area S"
    conditions: []
    dimension_lhs: "M L^2 T^-3 I^-2"
    dimension_rhs: "M L^2 T^-3 I^-2"

  - id: "series_resistors_three"
    name: "Equivalent Resistance for Three Series Resistors"
    expression: "R_eq = R_1 + R_2 + R_3"
    variables: ["R_eq", "R_1", "R_2", "R_3"]
    variable_quantities:
      R_eq: "equivalent_resistance"
      R_1: "resistance_1"
      R_2: "resistance_2"
      R_3: "resistance_3"
    domain: "electricity"
    topic: "circuits"
    description: "Equivalent resistance for three resistors connected in series"
    conditions: ["three resistors in series"]
    dimension_lhs: "M L^2 T^-3 I^-2"
    dimension_rhs: "M L^2 T^-3 I^-2"

  - id: "parallel_resistors_three"
    name: "Equivalent Resistance for Three Parallel Resistors"
    expression: "1 / R_eq = 1 / R_1 + 1 / R_2 + 1 / R_3"
    variables: ["R_eq", "R_1", "R_2", "R_3"]
    variable_quantities:
      R_eq: "equivalent_resistance"
      R_1: "resistance_1"
      R_2: "resistance_2"
      R_3: "resistance_3"
    domain: "electricity"
    topic: "circuits"
    description: "Equivalent resistance for three resistors connected in parallel"
    conditions: ["three resistors in parallel"]
    dimension_lhs: "M^-1 L^-2 T^3 I^2"
    dimension_rhs: "M^-1 L^-2 T^3 I^2"

  - id: "electric_energy_power_time"
    name: "Electrical energy A = P * t"
    expression: "A = P * t"
    variables: ["A", "P", "t"]
    variable_quantities:
      A: "work"
      P: "power"
      t: "time"
    domain: "electricity"
    topic: "circuits"
    description: "Electrical energy consumed equals power times time"
    conditions: []
    dimension_lhs: "M L^2 T^-2"
    dimension_rhs: "M L^2 T^-2"

  - id: "joule_heat_voltage_resistor"
    name: "Joule heat Q = (U^2 / R) * t"
    expression: "Q = (U^2 / R) * t"
    variables: ["Q", "U", "R", "t"]
    variable_quantities:
      Q: "heat"
      U: "voltage"
      R: "resistance"
      t: "time"
    domain: "electricity"
    topic: "circuits"
    description: "Heat generated in resistor given voltage U and resistance R"
    conditions: []
    dimension_lhs: "M L^2 T^-2"
    dimension_rhs: "M L^2 T^-2"

