units:
  base_units:
    - name: "meter"
      symbol: "m"
      dimension: "L"
    - name: "kilogram"
      symbol: "kg"
      dimension: "M"
    - name: "second"
      symbol: "s"
      dimension: "T"
    - name: "ampere"
      symbol: "A"
      dimension: "I"
    - name: "kelvin"
      symbol: "K"
      dimension: "Theta"
  derived_units:
    - name: "newton"
      symbol: "N"
      dimension: "M L T^-2"
      si_equivalent: "kg * m / s^2"
    - name: "joule"
      symbol: "J"
      dimension: "M L^2 T^-2"
      si_equivalent: "N * m"
    - name: "watt"
      symbol: "W"
      dimension: "M L^2 T^-3"
      si_equivalent: "J / s"
    - name: "pascal"
      symbol: "Pa"
      dimension: "M L^-1 T^-2"
      si_equivalent: "N / m^2"
