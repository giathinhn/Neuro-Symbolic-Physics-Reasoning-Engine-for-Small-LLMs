    aliases: ["electric resistance", "resistor"]

  - name: "resistance_1"
    symbol: "R_1"
    dimension: "M L^2 T^-3 I^-2"
    si_unit: "ohm"
    aliases: ["resistance 1", "resistor 1"]

  - name: "resistance_2"
    symbol: "R_2"
    dimension: "M L^2 T^-3 I^-2"
    si_unit: "ohm"
